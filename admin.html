        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes scaleUp { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        const firebaseConfig = {

        const CLOUD_NAME = 'dsxrjmcxs';

        const ADMIN_UID = 'mEVbroYWf7cg68SL8CB2uUS8XhZ2';

        const CustomSelect = ({ value, onChange, options, label, icon }) => {
            const [isOpen, setIsOpen] = useState(false);
            const dropdownRef = useRef(null);

            useEffect(() => {
                const handleClickOutside = (event) => {
                    if (dropdownRef.current && !dropdownRef.current.contains(event.target)) setIsOpen(false);
                };
                document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, []);

            const selectedOption = options.find(opt => opt.value === value) || options[0] || {label: 'اختر...'};

            return (
                <div className="space-y-1.5 relative w-full" ref={dropdownRef}>
                    {label && <label className="text-xs font-bold text-gray-600 ml-1 block">{label}</label>}
                    <button type="button" onClick={() => setIsOpen(!isOpen)} className={`w-full flex items-center justify-between p-3 rounded-xl border ${isOpen ? 'border-blue-500 ring-2 ring-blue-500/20 bg-white' : 'border-gray-200 bg-gray-50 hover:bg-gray-100'} transition-all text-sm font-bold text-gray-700 h-[46px]`}>
                        <div className="flex items-center gap-2 truncate">
                            {icon && <i className={`fa-solid ${icon} text-gray-400`}></i>}
                            {selectedOption.icon && <i className={`fa-solid ${selectedOption.icon} text-blue-500 w-4`}></i>}
                            <span className="truncate">{selectedOption.label}</span>
                        </div>
                        <i className={`fa-solid fa-chevron-down text-gray-400 text-[10px] transition-transform duration-300 ${isOpen ? 'rotate-180 text-blue-500' : ''}`}></i>
                    </button>
                    {isOpen && (
                        <div className="absolute top-full left-0 right-0 mt-1.5 bg-white border border-gray-100 shadow-xl rounded-xl z-50 overflow-hidden animate-dropdown">
                            <ul className="max-h-48 overflow-y-auto custom-scrollbar py-1">
                                {options.map((opt, idx) => (
                                    <li key={idx} onClick={() => { onChange(opt.value); setIsOpen(false); }} className={`flex items-center gap-2.5 px-4 py-2.5 cursor-pointer text-sm font-bold transition-colors ${value === opt.value ? 'bg-blue-50 text-blue-700' : 'text-gray-600 hover:bg-gray-50 hover:text-gray-900'}`}>
                                        {opt.icon && <i className={`fa-solid ${opt.icon} ${value === opt.value ? 'text-blue-500' : 'text-gray-400'} w-4 text-center`}></i>}
                                        <span className="flex-1">{opt.label}</span>
                                        {value === opt.value && <i className="fa-solid fa-check text-blue-500 text-xs"></i>}
                                    </li>
                                ))}
                            </ul>
                        </div>
                    )}
                </div>
            );
        };

        const MultiSelect = ({ values, onChange, options, label, icon }) => {
            const [isOpen, setIsOpen] = useState(false);
            const dropdownRef = useRef(null);

            useEffect(() => {
                const handleClickOutside = (e) => { if (dropdownRef.current && !dropdownRef.current.contains(e.target)) setIsOpen(false); };
                document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, []);

            const toggleValue = (val) => {
                if (values.includes(val)) onChange(values.filter(v => v !== val));
                else onChange([...values, val]);
            };

            return (
                <div className="space-y-1.5 relative w-full" ref={dropdownRef}>
                    {label && <label className="text-xs font-bold text-gray-600 ml-1 block">{label}</label>}
                    <button type="button" onClick={() => setIsOpen(!isOpen)} className={`w-full flex items-center justify-between p-2.5 rounded-xl border ${isOpen ? 'border-blue-500 ring-2 ring-blue-500/20 bg-white' : 'border-gray-200 bg-gray-50'} transition-all text-sm font-bold text-gray-700 min-h-[46px]`}>
                        <div className="flex items-center gap-1.5 flex-wrap">
                            {icon && <i className={`fa-solid ${icon} text-gray-400 mr-1`}></i>}
                            {values.length === 0 ? <span className="text-gray-400 text-sm">اختر المواد الدراسية...</span> : values.map(v => <span key={v} className="bg-blue-100 text-blue-800 text-[10px] px-2 py-1 rounded-md">{v}</span>)}
                        </div>
                        <i className={`fa-solid fa-chevron-down text-gray-400 text-[10px] ml-1 transition-transform ${isOpen ? 'rotate-180 text-blue-500' : ''}`}></i>
                    </button>
                    {isOpen && (
                        <div className="absolute top-full left-0 right-0 mt-1.5 bg-white border border-gray-100 shadow-xl rounded-xl z-50 overflow-hidden animate-dropdown">
                            <ul className="max-h-48 overflow-y-auto custom-scrollbar py-1">
                                {options.map((opt, idx) => (
                                    <li key={idx} onClick={() => toggleValue(opt.value)} className="flex items-center gap-3 px-4 py-2 cursor-pointer text-sm font-bold text-gray-600 hover:bg-gray-50">
                                        <div className={`w-4 h-4 rounded border flex items-center justify-center transition-colors ${values.includes(opt.value) ? 'bg-blue-500 border-blue-500 text-white' : 'border-gray-300'}`}>
                                            {values.includes(opt.value) && <i className="fa-solid fa-check text-[10px]"></i>}
                                        </div>
                                        <span>{opt.label}</span>
                                    </li>
                                ))}
                            </ul>
                        </div>
                    )}
                </div>
            );
        };

        const Toast = React.memo(({ message, type }) => {
            if (!message) return null;
            const bgClass = type === 'error' ? 'bg-red-50 border-red-500 text-red-700' : type === 'success' ? 'bg-green-50 border-green-500 text-green-700' : 'bg-blue-50 border-blue-500 text-blue-700';
            const iconClass = type === 'error' ? 'fa-triangle-exclamation text-red-500' : type === 'success' ? 'fa-circle-check text-green-500' : 'fa-circle-notch fa-spin text-blue-500';

            return (
                <div className={`fixed top-6 left-1/2 -translate-x-1/2 ${bgClass} border-b-4 px-6 py-3 rounded-xl shadow-xl text-sm font-bold z-[9999] flex items-center gap-3 whitespace-nowrap animate-toast`}>
                    <i className={`fa-solid ${iconClass} text-lg`}></i>
                    {message}
                </div>
            );
        });

        const AdminLogin = ({ showToast }) => {
            const [e, setE] = useState(''); const [p, setP] = useState('');
            const [isLoading, setIsLoading] = useState(false);

            const handle = async () => {
                if(!e || !p) return showToast("أدخل البريد وكلمة المرور", "error");
                setIsLoading(true);
                try {
                    await signInWithEmailAndPassword(auth, e, p);
                } catch { 
                    showToast("خطأ في البريد أو كلمة المرور", "error"); 
                    setIsLoading(false);
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-indigo-900 to-slate-950">
                    <div className="max-w-md w-full bg-white p-8 rounded-3xl shadow-2xl relative overflow-hidden">
                        <div className="absolute top-0 right-0 w-32 h-32 bg-indigo-50 rounded-bl-full -z-10 opacity-50"></div>
                        <div className="flex justify-center mb-6">
                            <div className="w-20 h-20 bg-indigo-900 text-white rounded-2xl flex items-center justify-center text-4xl shadow-lg"><i className="fa-solid fa-graduation-cap"></i></div>
                        </div>
                        <h2 className="text-2xl font-black mb-2 text-center text-gray-800">بوابة الإدارة والمعلمين</h2>
                        <p className="text-center text-gray-500 mb-8 text-xs font-bold">يرجى تسجيل الدخول للوصول للوحة التحكم</p>

                        <div className="space-y-4">
                            <div>
                                <label className="block text-xs font-bold text-gray-700 mb-1.5 ml-1">البريد الإلكتروني</label>
                                <div className="relative">
                                    <div className="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-gray-400"><i className="fa-solid fa-envelope"></i></div>
                                    <input type="email" placeholder="admin@example.com" className="w-full pl-4 pr-10 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-gray-50 text-sm font-bold" onChange={v=>setE(v.target.value)} />
                                </div>
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-gray-700 mb-1.5 ml-1">كلمة المرور</label>
                                <div className="relative">
                                    <div className="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-gray-400"><i className="fa-solid fa-lock"></i></div>
                                    <input type="password" placeholder="••••••••" className="w-full pl-4 pr-10 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-gray-50 text-sm font-bold" onChange={v=>setP(v.target.value)} />
                                </div>
                            </div>
                        </div>
                        <button onClick={handle} disabled={isLoading} className="w-full bg-indigo-900 hover:bg-indigo-800 text-white py-3.5 rounded-xl font-bold shadow-md text-sm mt-8 mb-4 transition-colors">
                            {isLoading ? <i className="fa-solid fa-circle-notch fa-spin"></i> : <><i className="fa-solid fa-arrow-left-to-bracket ml-2"></i> تسجيل الدخول</>}
                        </button>
                    </div>
                </div>
            );
        };

        const AdminDashboard = ({ materials, schedules, teachers, showToast, userData }) => {
            const [activeTab, setActiveTab] = useState('content');

            // Content States
            const [title, setTitle] = useState('');
            const [sec, setSec] = useState('lectures');
            const [year, setYear] = useState('الصف الأول الثانوي');
            const [studySystem, setStudySystem] = useState('عام');
            const [subject, setSubject] = useState('عام');
            const [isPrivate, setIsPrivate] = useState(false);
            const [loading, setLoading] = useState(false);
            const [uploadProgress, setUploadProgress] = useState(0);
            const [uploadQueue, setUploadQueue] = useState([]);
            const [confirmDelete, setConfirmDelete] = useState(null);

            // Teacher States
            const [tName, setTName] = useState('');
            const [tPhone, setTPhone] = useState('');
            const [tSubjects, setTSubjects] = useState([]);
            const [tLocations, setTLocations] = useState('');
            const [tDesc, setTDesc] = useState('');
            const [tPhoto, setTPhoto] = useState(null);
            const [tCreds, setTCreds] = useState(null);

            // Code States
            const [cStudentName, setCStudentName] = useState('');
            const [cStudentPhone, setCStudentPhone] = useState('');
            const [cTeacher, setCTeacher] = useState('');
            const [cSubjects, setCSubjects] = useState([]);
            const [cYear, setCYear] = useState('الصف الأول الثانوي');
            const [cSystem, setCSystem] = useState('عام');
            const [generatedCode, setGeneratedCode] = useState(null);

            // Profile States
            const [myProfileName, setMyProfileName] = useState('');
            const [myProfilePhone, setMyProfilePhone] = useState('');
            const [myProfileSubjects, setMyProfileSubjects] = useState([]);
            const [myProfileLocations, setMyProfileLocations] = useState('');
            const [myProfileDesc, setMyProfileDesc] = useState('');
            const [myProfilePhoto, setMyProfilePhoto] = useState(null);
            const [myProfilePhotoUrl, setMyProfilePhotoUrl] = useState('');

            useEffect(() => {
                if (userData && teachers.length > 0) {
                    const myProf = teachers.find(t => t.uid === userData.uid);
                    if (myProf) {
                        setMyProfileName(myProf.name || '');
                        setMyProfilePhone(myProf.phone || '');
                        setMyProfileSubjects(myProf.subjects || []);
                        setMyProfileLocations(myProf.locations || '');
                        setMyProfileDesc(myProf.description || '');
                        setMyProfilePhotoUrl(myProf.photoUrl || '');
                    } else if (userData.role === 'admin') {
                        setMyProfileName('الإدارة العامة');
                    }
                }
            }, [userData, teachers]);

            const sectionOptions = userData.role === 'teacher' ? [
                { value: 'lectures', label: 'قسم المحاضرات', icon: 'fa-person-chalkboard' },
                { value: 'notes', label: 'قسم المذكرات', icon: 'fa-book' },
                { value: 'reviews', label: 'قسم المراجعات', icon: 'fa-file-shield' }
            ] : [
                { value: 'lectures', label: 'قسم المحاضرات', icon: 'fa-person-chalkboard' },
                { value: 'notes', label: 'قسم المذكرات', icon: 'fa-book' },
                { value: 'reviews', label: 'قسم المراجعات', icon: 'fa-file-shield' },
                { value: 'activities', label: 'قسم الأنشطة (عام)', icon: 'fa-users-gear' },
                { value: 'schedule', label: 'جدول محاضرات (سلايدر)', icon: 'fa-images' }
            ];

            const yearOptions = [{ value: 'الصف الأول الثانوي', label: 'الصف الأول الثانوي', icon: 'fa-1' }, { value: 'الصف الثاني الثانوي', label: 'الصف الثاني الثانوي', icon: 'fa-2' }, { value: 'الصف الثالث الثانوي', label: 'الصف الثالث الثانوي', icon: 'fa-3' }];
            const systemOptions = [{ value: 'عام', label: 'عام', icon: 'fa-users' }, { value: 'علمي علوم', label: 'علمي علوم', icon: 'fa-flask' }, { value: 'علمي رياضة', label: 'علمي رياضة', icon: 'fa-square-root-variable' }, { value: 'أدبي', label: 'أدبي', icon: 'fa-book-open' }, { value: 'نظام البكالوريا', label: 'نظام البكالوريا', icon: 'fa-globe' }];

            const subjectList = ['اللغة العربية', 'اللغة الإنجليزية', 'اللغة الفرنسية', 'الرياضيات', 'الفيزياء', 'الكيمياء', 'الأحياء', 'التاريخ', 'الجغرافيا', 'الفلسفة', 'علم النفس', 'الجيولوجيا'].map(s => ({label: s, value: s}));

            const myTeacherProfile = teachers.find(t => t.uid === userData.uid);
            const availableSubjects = userData.role === 'admin' 
                ? [{value: 'عام', label: 'عام'}, ...subjectList]
                : (myTeacherProfile?.subjects || []).map(s => ({value: s, label: s}));

            useEffect(() => {
                if(availableSubjects.length > 0 && subject === 'عام' && userData.role === 'teacher') {
                    setSubject(availableSubjects[0].value);
                }
            }, [availableSubjects, subject, userData]);

            const handleFileChange = (e) => {
                const files = Array.from(e.target.files);
                setUploadQueue(files.map(f => {
                    const isMedia = f.type.startsWith('image/') || f.type.startsWith('video/');
                    return { file: f, title: isMedia ? '' : f.name.split('.')[0] };
                }));
            };

            const uploadFileWithProgress = (file, isCompressed) => {
                return new Promise((resolve, reject) => {
                    const xhr = new XMLHttpRequest();
                    xhr.timeout = 0; 
                    xhr.open('POST', `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`);
                    xhr.upload.onprogress = (e) => { if (e.lengthComputable) setUploadProgress(isCompressed ? 40 + Math.floor(Math.round((e.loaded / e.total) * 100) * 0.6) : Math.round((e.loaded / e.total) * 100)); };
                    xhr.onload = () => { if (xhr.status === 200) resolve(JSON.parse(xhr.responseText)); else reject(JSON.parse(xhr.responseText)); };
                    xhr.onerror = () => reject("Network Error");
                    const formData = new FormData();
                    formData.append('file', file);
                    formData.append('upload_preset', UPLOAD_PRESET);
                    xhr.send(formData);
                });
            };

            const uploadContent = async () => {
                if(userData.role === 'teacher' && !myTeacherProfile) {
                    return showToast("برجاء استكمال ملفك الشخصي أولاً لتتمكن من النشر وتحديد المواد", "error");
                }
                setLoading(true); setUploadProgress(0);
                try {
                    const { default: imageCompression } = await import('https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/+esm');

                    const isGlobalSection = sec === 'activities';
                    const finalYear = isGlobalSection ? 'عام' : year;
                    const finalStudySystem = (sec === 'lectures' || sec === 'notes' || sec === 'reviews') ? studySystem : 'عام';
                    const finalTeacherId = userData.role === 'teacher' ? userData.uid : null;

                    if (uploadQueue.length > 0) {
                        const hasEmptyTitles = uploadQueue.some(item => !item.title || !item.title.trim());
                        if (hasEmptyTitles) { showToast("الرجاء كتابة وصف/عنوان لجميع الملفات", "error"); setLoading(false); return; }

                        for (let i = 0; i < uploadQueue.length; i++) {
                            const item = uploadQueue[i]; setUploadProgress(0);
                            let fileUrl = null; let fileToUpload = item.file;
                            let isPdf = fileToUpload.type === 'application/pdf' || fileToUpload.name.toLowerCase().endsWith('.pdf');
                            let isVideo = fileToUpload.type.startsWith('video/');
                            let isCompressed = false;

                            if (fileToUpload.type.startsWith('image/') && fileToUpload.size > 500 * 1024) { 
                                showToast(`جاري ضغط الصورة (${i+1}/${uploadQueue.length})...`, "info", 0);
                                try { fileToUpload = await imageCompression(fileToUpload, { maxSizeMB: 0.5, maxWidthOrHeight: 1000, useWebWorker: true, initialQuality: 0.6 }); isCompressed = true; } catch (e) { console.error(e); }
                            }
                            showToast(`جاري الرفع (${i+1}/${uploadQueue.length})...`, "info", 0);
                            const d = await uploadFileWithProgress(fileToUpload, isCompressed);
                            fileUrl = (!isPdf && !isVideo && d.secure_url.includes('/image/upload/')) ? d.secure_url.replace('/upload/', '/upload/w_1000,q_auto,f_auto/') : d.secure_url;

                            if (sec === 'schedule') {
                                // تم تحويل الجدول إلى v2_schedules
                                await addDoc(collection(db, 'v2_schedules'), { title: item.title, url: fileUrl, createdAt: Date.now() });
                            } else {
                                // تم تحويل الجدول إلى v2_materials
                                await addDoc(collection(db, 'v2_materials'), { 
                                    title: item.title, fileUrl: fileUrl, sectionType: sec, 
                                    year: finalYear, studySystem: finalStudySystem, subject: subject, 
                                    isPrivate: isPrivate, teacherId: finalTeacherId, createdAt: Date.now() 
                                });
                            }
                        }
                    } else {
                        if (!title) { showToast("الرجاء كتابة العنوان", "error"); setLoading(false); return; }
                        // تم تحويل الجدول إلى v2_materials
                        await addDoc(collection(db, 'v2_materials'), { 
                            title: title, fileUrl: null, sectionType: sec, 
                            year: finalYear, studySystem: finalStudySystem, subject: subject, 
                            isPrivate: isPrivate, teacherId: finalTeacherId, createdAt: Date.now() 
                        });
                    }
                    showToast("تمت الإضافة بنجاح", "success");
                    setTitle(''); setUploadQueue([]); setUploadProgress(0);
                    if(document.getElementById('fileInput')) document.getElementById('fileInput').value = '';
                } catch(e) { showToast("خطأ أثناء الرفع، تأكد من اتصالك أو قواعد Firestore", "error"); console.error(e); }
                setLoading(false);
            };

            const createTeacher = async () => {
                if(!tName || !tPhone || tSubjects.length === 0 || !tPhoto) return showToast("يرجى إكمال جميع الحقول وإرفاق صورة", "error");
                setLoading(true); setTCreds(null);
                try {
                    const email = `tech_${Date.now().toString().slice(-6)}@foc.com`;
                    const password = Math.random().toString(36).slice(-8);

                    const { default: imageCompression } = await import('https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/+esm');
                    let fileToUpload = tPhoto;
                    if (fileToUpload.size > 500 * 1024) fileToUpload = await imageCompression(fileToUpload, { maxSizeMB: 0.2, maxWidthOrHeight: 500 });

                                        <div>
                                            <label className="text-xs font-bold text-gray-600 ml-1 block mb-2">تحديث صورتك الشخصية</label>
                                            <input type="file" accept="image/*" onChange={e=>setMyProfilePhoto(e.target.files[0])} className="w-full text-sm font-bold text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-bold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer border border-gray-200 rounded-xl p-2 bg-gray-50" />
                                        </div>
                                        <button onClick={saveMyProfile} disabled={loading} className="w-full bg-indigo-900 hover:bg-indigo-800 text-white py-4 rounded-xl font-black shadow-lg transition-colors">
                                            {loading ? <><i className="fa-solid fa-circle-notch fa-spin"></i> جاري حفظ البروفايل...</> : <><i className="fa-solid fa-circle-check ml-1"></i> حفظ وتحديث الملف الشخصي</>}
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>

                        {activeTab === 'content' && (
                            <div className="lg:col-span-3 space-y-6">
                                <div className="bg-white p-5 rounded-3xl border border-gray-100 h-[650px] flex flex-col">
                                    <div className="flex items-center justify-between mb-5 pb-4 border-b border-gray-100">
                                        <h3 className="font-black text-sm text-gray-800 border-r-4 border-indigo-900 pr-2">سجل محتواك المنشور</h3>
                                        <span className="bg-gray-100 text-gray-600 px-3 py-1 rounded-full text-xs font-bold">{myMaterials.length + (userData.role === 'admin' ? schedules.length : 0)}</span>
                                    </div>
                                    <div className="flex-1 overflow-y-auto custom-scrollbar pr-1 space-y-3">
                                        {myMaterials.map(m => (
                                            <div key={m.id} className="flex justify-between items-center p-3 bg-gray-50 border border-gray-100 rounded-2xl hover:bg-white hover:shadow-md transition-all group">
                                                <div className="flex flex-col gap-1 overflow-hidden pr-1">
                                                    <span className="font-black text-xs text-gray-800 line-clamp-1">{m.title}</span>
                                                    <div className="flex flex-wrap gap-1 items-center">
                                                        <span className="text-gray-500 text-[8px] font-bold bg-white px-1.5 py-0.5 rounded border border-gray-200 shadow-sm">{m.sectionType}</span>
                                                        {m.subject && m.subject !== 'عام' && <span className="text-blue-600 text-[8px] font-bold bg-blue-50 px-1.5 py-0.5 rounded border border-blue-100 shadow-sm">{m.subject}</span>}
                                                        {m.isPrivate && <span className="text-red-600 text-[8px] font-black bg-red-50 px-1.5 py-0.5 rounded border border-red-100 shadow-sm"><i className="fa-solid fa-lock text-[8px] ml-0.5"></i> خاص</span>}
                                                    </div>
                                                </div>
                                                {/* تم تغيير اسم الجدول إلى v2_materials عند الحذف */}
                                                <button onClick={()=>requestDelete('v2_materials', m.id, m.title)} className="w-8 h-8 flex-shrink-0 bg-white border border-red-100 text-red-500 hover:bg-red-500 hover:text-white rounded-lg flex items-center justify-center transition-colors shadow-sm ml-1"><i className="fa-solid fa-trash-can text-xs"></i></button>
                                            </div>
                                        ))}
                                        {userData.role === 'admin' && schedules.map(s => (
                                            <div key={s.id} className="flex justify-between items-center p-3 bg-yellow-50 border border-yellow-200 rounded-2xl hover:shadow-md transition-all">
                                                <div className="flex flex-col gap-1 overflow-hidden pr-1">
                                                    <span className="font-black text-xs text-yellow-900 line-clamp-1">{s.title}</span>
                                                    <span className="text-yellow-700 text-[8px] font-bold bg-white/60 px-1.5 py-0.5 rounded w-fit border border-yellow-200 shadow-sm">سلايدر الرئيسية</span>
                                                </div>
                                                {/* تم تغيير اسم الجدول إلى v2_schedules عند الحذف */}
                                                <button onClick={()=>requestDelete('v2_schedules', s.id, s.title)} className="w-8 h-8 flex-shrink-0 bg-white border border-red-200 text-red-500 hover:bg-red-500 hover:text-white rounded-lg flex items-center justify-center transition-colors shadow-sm ml-1"><i className="fa-solid fa-trash-can text-xs"></i></button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>

                    {confirmDelete && (
                        <div className="fixed inset-0 z-[9999] flex items-center justify-center p-4">
                            <div className="absolute inset-0 bg-gray-900/40 backdrop-blur-sm animate-fade" onClick={() => setConfirmDelete(null)}></div>
                            <div className="relative bg-white rounded-3xl p-6 md:p-8 max-w-sm w-full shadow-2xl animate-scale border border-gray-100 text-center">
                                <div className="w-20 h-20 bg-red-50 rounded-full flex items-center justify-center mx-auto mb-5 border-4 border-red-100"><i className="fa-solid fa-triangle-exclamation text-3xl text-red-500"></i></div>
                                <h3 className="text-xl font-black text-gray-800 mb-2">تأكيد الحذف</h3>
                                <p className="text-red-600 font-black text-sm mb-6 bg-red-50 p-3 rounded-xl border border-red-100 line-clamp-2">{confirmDelete.title}</p>
                                <div className="flex gap-3">
                                    <button onClick={executeDelete} className="flex-1 bg-red-500 hover:bg-red-600 text-white py-3 rounded-xl text-sm font-bold shadow-md shadow-red-500/20 transition-colors">تأكيد الحذف</button>
                                    <button onClick={() => setConfirmDelete(null)} className="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 py-3 rounded-xl text-sm font-bold transition-colors">تراجع</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [userData, setUserData] = useState(null);
            const [materials, setMaterials] = useState([]);
            const [schedules, setSchedules] = useState([]);
            const [teachers, setTeachers] = useState([]);
            const [toast, setToast] = useState({ message: '', type: '' });

            const showToast = useCallback((message, type = 'info', duration = 3000) => {
                setToast({ message, type });
                if (duration) setTimeout(() => setToast({ message: '', type: '' }), duration);
            },[]);

            useEffect(() => {
                const unsubscribeAuth = onAuthStateChanged(auth, async (u) => {
                    if (u) {
                        if (u.uid === ADMIN_UID) {
                            setUserData({ role: 'admin', uid: u.uid });
                        } else {
                            try {
                                // تم تحويل الجدول إلى v2_users لقراءة بيانات المدرسين المنفصلين
                                const docSnap = await getDoc(doc(db, 'v2_users', u.uid));
                                if (docSnap.exists() && docSnap.data().role === 'teacher') {
                                    setUserData({ role: 'teacher', uid: u.uid, ...docSnap.data() });
                                } else {
                                    await signOut(auth); showToast("ليس لديك صلاحية للدخول", "error"); setUserData(null);
                                }
                            } catch(e) { await signOut(auth); setUserData(null); }
                        }
                    } else { setUserData(null); }
                });
                return () => unsubscribeAuth();
            },[]);

            useEffect(() => {
                if (userData) {
                    // تم تعديل كافة مسميات جداول القراءة لتوافق الـ v2_ الجديدة بالكامل
                    const unsubMat = onSnapshot(query(collection(db, 'v2_materials'), orderBy('createdAt', 'desc'), limit(300)), (snap) => setMaterials(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                    const unsubSch = onSnapshot(collection(db, 'v2_schedules'), (snap) => setSchedules(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                    const unsubTeach = onSnapshot(collection(db, 'v2_teachers'), (snap) => setTeachers(snap.docs.map(d => ({ id: d.id, ...d.data() }))));

                    return () => { unsubMat(); unsubSch(); unsubTeach(); };
                }
            }, [userData]);

            return (
                <div className="min-h-screen relative selection:bg-indigo-200 selection:text-indigo-900">
                    <Toast message={toast.message} type={toast.type} />
                    {!userData ? <AdminLogin showToast={showToast} /> : <AdminDashboard materials={materials} schedules={schedules} teachers={teachers} showToast={showToast} userData={userData} />}
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
