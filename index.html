    <style>
        @font-face { font-family: 'Cairo'; font-style: normal; font-weight: 400; src: local('Cairo'), url('./assets/fonts/cairo-regular.woff2') format('woff2'); font-display: block; }
        @font-face { font-family: 'Cairo'; font-style: normal; font-weight: 700; src: local('Cairo'), url('./assets/fonts/cairo-bold.woff2') format('woff2'); font-display: block; }
        @font-face { font-family: 'Cairo'; font-style: normal; font-weight: 900; src: local('Cairo'), url('./assets/fonts/cairo-black.woff2') format('woff2'); font-display: block; }

        /* منع تحديد النصوص ليعطي إحساس تطبيق حقيقي */

        button, a, select, input, .optimized-card { touch-action: manipulation; }
        .ad-container:empty { display: none !important; }
        .nav-link-active { border-bottom: 3px solid #f59e0b; color: #f59e0b !important; }
        .sidebar-scroll::-webkit-scrollbar { height: 4px; width: 4px; }
        .sidebar-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        .bottom-nav-safe {

</head>
<body class="text-slate-800 bg-slate-50">

    <div id="root">
        <!-- شاشة التحميل الوهمية (Splash Screen) -->
        <div style="height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background-color: #312e81;">
            <div style="width: 50px; height: 50px; border: 4px solid #fff; border-top: 4px solid #f59e0b; border-radius: 50%; animation: spin 1s linear infinite;"></div>
            <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
            <h2 style="color: white; margin-top: 20px; font-family: 'Cairo', sans-serif; font-weight: bold;">جاري التحميل...</h2>
        </div>
    </div>

    <script type="module">
        import React, { useState, useEffect, useRef, useMemo, useCallback } from 'react';
        import { createRoot } from 'react-dom/client';
        import htm from 'htm';
        
        const html = htm.bind(React.createElement);

        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAnalytics } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-analytics.js';
        import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, onSnapshot, query, orderBy, limit, doc, setDoc, serverTimestamp, getDocs, where, updateDoc } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';
        import { getMessaging, getToken, onMessage } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-messaging.js';

        const toNumericId = (str) => {
            if (!str) return '';
            let hash = 0;
            for (let i = 0; i < str.length; i++) { hash = ((hash << 5) - hash) + str.charCodeAt(i); hash |= 0; }
            return String(1000 + (Math.abs(hash) % 9000));
        };

        const getCleanBaseUrl = () => {
            let url = window.location.origin + window.location.pathname;
            return url.replace(/\/index\.html$/, '/');
        };

        const firebaseConfig = {
            apiKey: "AIzaSyANg4wLchZaikXneXr1c3qhRgcOnvPbfoA",
            authDomain: "faculty-of-commerce-2026.firebaseapp.com",
            projectId: "faculty-of-commerce-2026",
            storageBucket: "faculty-of-commerce-2026.firebasestorage.app",
            messagingSenderId: "350727231766",
            appId: "1:350727231766:web:b08a0f335e38bfc2e79837"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = initializeFirestore(app, { localCache: persistentLocalCache({tabManager: persistentMultipleTabManager()}) });

        let messaging;
        try { messaging = getMessaging(app); } catch (e) { console.error("Firebase Messaging not supported:", e); }

        const isVideoUrl = (url) => {
            if (!url) return false;
            return url.match(/\.(mp4|webm|ogg|mov)$/i) || url.includes('/video/upload/');
        };

        const getThumbnail = (url, type = 'default') => {
            if (!url) return '';
            if (url.includes('cloudinary.com')) {
                let transform = '/upload/w_300,h_300,c_fill,q_auto:eco,f_auto/';
                if (type === 'a4') transform = '/upload/w_200,h_280,c_fill,q_auto:eco,f_auto/';
                if (type === 'slider') transform = '/upload/w_800,h_400,c_fit,q_auto:eco,f_auto/';
                if (url.toLowerCase().endsWith('.pdf')) return url.replace('/upload/', transform).replace(/\.pdf$/i, '.jpg');
                if (isVideoUrl(url)) return url.replace('/upload/', transform).replace(/\.(mp4|webm|ogg|mov)$/i, '.jpg');
                return url.replace('/upload/', transform);
            }
            return url;
        };

        const Toast = React.memo(({ message, type }) => {
            if (!message) return null;
            const bgClass = type === 'error' ? 'bg-red-600' : type === 'success' ? 'bg-emerald-600' : 'bg-indigo-800';
            const icon = type === 'error' ? 'fa-triangle-exclamation' : type === 'success' ? 'fa-check-circle' : 'fa-circle-notch fa-spin';

            return html`
                <div className=${`fixed top-20 lg:top-24 left-1/2 -translate-x-1/2 ${bgClass} text-white px-5 py-2.5 rounded-full shadow-lg text-xs font-bold z-[999] flex items-center gap-3 whitespace-nowrap`}>
                    <i className=${`fa-solid ${icon} text-sm`}></i>
                    ${message}
                </div>
            `;
        });

        const PreviewModal = React.memo(({ previewData, onClose, onNavigate }) => {
            const[isMediaLoading, setIsMediaLoading] = useState(true);

            useEffect(() => {
                if (previewData.items.length > 0) { document.body.style.overflow = 'hidden'; setIsMediaLoading(true); } 
                else { document.body.style.overflow = 'auto'; }
                return () => { document.body.style.overflow = 'auto'; };
            },[previewData]);

            if (previewData.items.length === 0) return null;
            const currentItem = previewData.items[previewData.index];
            if (!currentItem || !currentItem.url) return null;

            const isPdf = currentItem.url.toLowerCase().includes('.pdf');
            const isVid = isVideoUrl(currentItem.url);
            const pdfViewerUrl = `https://docs.google.com/gview?url=${encodeURIComponent(currentItem.url)}&embedded=true`;

            return html`
                <div className="fixed inset-0 z-[9999] flex items-center justify-center bg-black/95 p-2 md:p-10">
                    <button onClick=${onClose} className="absolute top-4 right-4 md:top-6 md:right-6 bg-red-600 text-white w-10 h-10 rounded-full flex items-center justify-center hover:bg-red-700 z-50 shadow-lg border-2 border-white"><i className="fa-solid fa-xmark text-xl"></i></button>
                    <div className="w-full h-full max-w-6xl bg-black rounded-xl overflow-hidden relative flex items-center justify-center shadow-2xl">
                        ${isMediaLoading && html`
                            <div className="absolute inset-0 flex flex-col items-center justify-center z-40 bg-black/50">
                                <i className="fa-solid fa-circle-notch fa-spin text-white text-4xl mb-2" style=${{animation: 'fa-spin 2s infinite linear !important'}}></i>
                                <span className="text-white text-xs font-bold mt-2">جاري التحميل...</span>
                            </div>
                        `}
                        ${isPdf ? html`<iframe onLoad=${() => setIsMediaLoading(false)} src=${pdfViewerUrl} className="w-full h-full border-0 bg-white relative z-30" title="PDF Preview"></iframe>`
                        : isVid ? html`<video onLoadedData=${() => setIsMediaLoading(false)} src=${currentItem.url} controls autoPlay className="max-w-full max-h-full outline-none relative z-30" playsInline></video>`
                        : html`<img onLoad=${() => setIsMediaLoading(false)} src=${currentItem.url} alt="Preview" className="max-w-full max-h-full object-contain relative z-30" decoding="async" />`}

                        ${previewData.items.length > 1 && html`
                            <${React.Fragment}>
                                <button onClick=${(e) => { e.stopPropagation(); onNavigate('prev'); }} className="absolute left-4 top-1/2 -translate-y-1/2 bg-black/60 hover:bg-black/90 text-white w-10 h-10 md:w-12 md:h-12 rounded-full flex items-center justify-center z-50"><i className="fa-solid fa-chevron-left text-lg md:text-xl"></i></button>
                                <button onClick=${(e) => { e.stopPropagation(); onNavigate('next'); }} className="absolute right-4 top-1/2 -translate-y-1/2 bg-black/60 hover:bg-black/90 text-white w-10 h-10 md:w-12 md:h-12 rounded-full flex items-center justify-center z-50"><i className="fa-solid fa-chevron-right text-lg md:text-xl"></i></button>
                            </${React.Fragment}>
                        `}
                    </div>
                </div>
            `;
        });

        const AdSlot = React.memo(({ id }) => {
            const adRef = useRef(null);
            const[hasAd, setHasAd] = useState(false);
            useEffect(() => { if (adRef.current && adRef.current.innerHTML.trim() !== "") setHasAd(true); },[]);
            return html`<div ref=${adRef} className=${`ad-container w-full ${hasAd ? 'my-6 py-4 bg-slate-50 border' : 'h-0 overflow-hidden'}`}></div>`;
        });

        const SectionView = React.memo(({ type, title, icon, data, teachers = [], hideYearFilter = false, showSystemFilter = false, onBack, onPreviewSingle, onRequestDownload, initialFilters, showToast, highlightedItemId, isLoading }) => {
            const[filterYear, setFilterYear] = useState(initialFilters?.year || 'اختار الصف');
            const[filterSystem, setFilterSystem] = useState(initialFilters?.system || 'اختار الشعبة'); 
            const[filterTeacher, setFilterTeacher] = useState(initialFilters?.teacherId || 'اختار المعلم');
            const[visibleCount, setVisibleCount] = useState(6);
            const[openDropdown, setOpenDropdown] = useState(null);
            const dropdownRef = useRef(null);
            const loaderRef = useRef(null);

            useEffect(() => {
                const handleClickOutside = (event) => { if (dropdownRef.current && !dropdownRef.current.contains(event.target)) setOpenDropdown(null); };
                document.addEventListener("mousedown", handleClickOutside);
                return () => document.removeEventListener("mousedown", handleClickOutside);
            },[]);

            useEffect(() => {
                if(initialFilters?.year) setFilterYear(initialFilters.year);
                if(initialFilters?.system) setFilterSystem(initialFilters.system);
                if(initialFilters?.teacherId) setFilterTeacher(initialFilters.teacherId);
            },[initialFilters]);

            const years = ['اختار الصف', 'الصف الأول الثانوي', 'الصف الثاني الثانوي', 'الصف الثالث الثانوي'];
            const systems = ['اختار الشعبة', 'علمي علوم', 'علمي رياضة', 'أدبي', 'نظام البكالوريا'];

            const filtered = useMemo(() => {
                return data.filter(item => {
                    const matchYear = hideYearFilter || filterYear === 'اختار الصف' || item.year === filterYear || item.year === 'عام';
                    const itemSystem = item.studySystem || 'عام';
                    const matchSystem = !showSystemFilter || filterSystem === 'اختار الشعبة' || itemSystem === 'عام' || itemSystem === filterSystem;
                    const matchTeacher = filterTeacher === 'اختار المعلم' || item.teacherId === filterTeacher;
                    return matchYear && matchSystem && matchTeacher;
                });
            },[data, filterYear, filterSystem, filterTeacher, hideYearFilter, showSystemFilter]);

            useEffect(() => {
                if(highlightedItemId) {
                    const itemIndex = filtered.findIndex(i => toNumericId(i.id) === highlightedItemId);
                    if(itemIndex >= visibleCount) setVisibleCount(itemIndex + 12);
                }
            },[highlightedItemId, filtered]);

            useEffect(() => {
                const observer = new IntersectionObserver((entries) => {
                    if (entries[0].isIntersecting && !isLoading && visibleCount < filtered.length) {
                        setVisibleCount(prev => prev + 12);
                    }
                }, { threshold: 0.1 });
                if (loaderRef.current) observer.observe(loaderRef.current);
                return () => observer.disconnect();
            }, [filtered.length, visibleCount, isLoading]);

            const visibleData = filtered.slice(0, visibleCount);
            const isActivities = type === 'activities';
            const isA4Card = type === 'lectures' || type === 'notes' || type === 'reviews';
            const thumbType = isA4Card ? 'a4' : 'default';

            const gridClass = isActivities ? "columns-2 md:columns-3 gap-3 space-y-3" : "grid gap-3 md:gap-4 grid-cols-1 sm:grid-cols-2 lg:grid-cols-3";

            const formatDate = (timestamp) => {
                if (!timestamp) return '';
                const d = new Date(timestamp);
                return `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;
            };

            const handleShareCard = async (e, item) => {
                e.stopPropagation();
                try {
                    const baseUrl = getCleanBaseUrl();
                    const shareUrl = `${baseUrl}?p=${type}&i=${toNumericId(item.id)}`;
                    if (navigator.share) await navigator.share({ title: item.title, text: `شاهد: ${item.title}`, url: shareUrl });
                    else { await navigator.clipboard.writeText(shareUrl); showToast("تم نسخ رابط الملف المصغر", "success"); }
                } catch (err) { console.error(err); }
            };

            const handleShareSection = async (e) => {
                e.stopPropagation();
                try {
                    const baseUrl = getCleanBaseUrl();
                    const params = new URLSearchParams();
                    params.set('p', type);
                    const getYearCode = (y) => { if(y === 'الصف الأول الثانوي') return '1'; if(y === 'الصف الثاني الثانوي') return '2'; if(y === 'الصف الثالث الثانوي') return '3'; return ''; };
                    const getSystemCode = (s) => { if(s === 'علمي علوم') return 's'; if(s === 'علمي رياضة') return 'm'; if(s === 'أدبي') return 'l'; if(s === 'نظام البكالوريا') return 'b'; return ''; };
                    if (!hideYearFilter && filterYear !== 'اختار الصف') { const yCode = getYearCode(filterYear); if(yCode) params.set('y', yCode); }
                    if (showSystemFilter && filterSystem !== 'اختار الشعبة') { const sCode = getSystemCode(filterSystem); if(sCode) params.set('s', sCode); }
                    const shareUrl = `${baseUrl}?${params.toString()}`;
                    if (navigator.share) await navigator.share({ title: title, text: `تصفح ${title} - الثانوية العامة`, url: shareUrl });
                    else { await navigator.clipboard.writeText(shareUrl); showToast("تم نسخ رابط القسم بالفلاتر", "success"); }
                } catch (err) { console.error(err); }
            };

            return html`
                <div className="bg-soft-white p-3 md:p-4 rounded-xl shadow-sm border border-indigo-900/5">
                    <div className="flex items-start justify-between mb-3 border-b border-slate-100 pb-2 gap-2 relative">
                        <div className="flex items-start gap-1.5 flex-1 min-w-0 pt-0.5">
                            <button onClick=${onBack} className="text-slate-500 hover:text-indigo-900 bg-slate-100 hover:bg-slate-200 w-6 h-6 md:w-7 md:h-7 rounded-full flex items-center justify-center flex-shrink-0 mt-0.5"><i className="fa-solid fa-arrow-right text-[10px]"></i></button>
                            <div className="text-indigo-800 text-xs hidden sm:block mt-1"><i className=${`fa-solid ${icon}`}></i></div>
                            <h2 className="text-xs md:text-sm font-black text-slate-800 leading-snug break-words whitespace-normal">${title}</h2>
                        </div>

                        <div className="flex items-center gap-1.5 flex-shrink-0 pt-0.5" ref=${dropdownRef}>
                            <button onClick=${handleShareSection} className="bg-amber-50 hover:bg-amber-100 text-amber-700 border border-amber-200 w-6 h-6 md:w-7 md:h-7 rounded-md flex items-center justify-center flex-shrink-0 shadow-sm" title="مشاركة القسم">
                                <i className="fa-solid fa-share-nodes text-[10px] md:text-xs"></i>
                            </button>

                            ${type !== 'activities' && Array.isArray(teachers) && teachers.length > 0 && html`
                                <div className="relative">
                                    <button onClick=${() => setOpenDropdown(openDropdown === 'teacher' ? null : 'teacher')} className="flex items-center gap-1.5 bg-amber-500 text-indigo-950 text-[9px] md:text-[10px] font-black rounded-md px-2.5 py-1.5 outline-none cursor-pointer shadow-sm border border-amber-400 hover:bg-amber-400">
                                        ${filterTeacher === 'اختار المعلم' ? 'المعلم' : ((Array.isArray(teachers) && teachers.find(t => t.uid === filterTeacher)?.name) || 'المعلم')} <i className=${`fa-solid fa-chevron-down text-[8px] ${openDropdown === 'teacher' ? 'rotate-180' : ''}`}></i>
                                    </button>
                                    ${openDropdown === 'teacher' && html`
                                        <div className="absolute top-full mt-1 right-0 w-36 bg-white rounded-lg shadow-xl border border-slate-100 z-50 overflow-hidden max-h-48 overflow-y-auto">
                                            <div onClick=${() => { setFilterTeacher('اختار المعلم'); setVisibleCount(6); setOpenDropdown(null); }} className=${`px-3 py-2 text-[10px] font-bold cursor-pointer border-b border-slate-50 hover:bg-slate-50 ${filterTeacher === 'اختار المعلم' ? 'bg-indigo-50 text-indigo-900' : 'text-slate-700'}`}>الكل</div>
                                            ${Array.isArray(teachers) && teachers.map(t => html`<div key=${t.uid} onClick=${() => { setFilterTeacher(t.uid); setVisibleCount(6); setOpenDropdown(null); }} className=${`px-3 py-2 text-[10px] font-bold cursor-pointer border-b border-slate-50 hover:bg-slate-50 last:border-0 ${filterTeacher === t.uid ? 'bg-indigo-50 text-indigo-900' : 'text-slate-700'}`}>${t.name}</div>`)}
                                        </div>
                                    `}
                                </div>
                            `}

                            ${(!hideYearFilter || showSystemFilter) && html`
                                <${React.Fragment}>
                                    ${!hideYearFilter && html`
                                        <div className="relative">
                                            <button onClick=${() => setOpenDropdown(openDropdown === 'year' ? null : 'year')} className="flex items-center gap-1.5 bg-indigo-900 text-white text-[9px] md:text-[10px] font-bold rounded-md px-2.5 py-1.5 outline-none cursor-pointer shadow-sm border border-indigo-800 hover:bg-indigo-800">
                                                ${filterYear} <i className=${`fa-solid fa-chevron-down text-[8px] ${openDropdown === 'year' ? 'rotate-180' : ''}`}></i>
                                            </button>
                                            ${openDropdown === 'year' && html`
                                                <div className="absolute top-full mt-1 right-0 w-32 bg-white rounded-lg shadow-xl border border-slate-100 z-50 overflow-hidden">
                                                    ${years.map(y => html`<div key=${y} onClick=${() => { setFilterYear(y); setVisibleCount(6); setOpenDropdown(null); }} className=${`px-3 py-2 text-[10px] font-bold cursor-pointer border-b border-slate-50 last:border-0 ${filterYear === y ? 'bg-indigo-50 text-indigo-900' : 'text-slate-700 hover:bg-slate-50'}`}>${y}</div>`)}
                                                </div>
                                            `}
                                        </div>
                                    `}
                                    ${showSystemFilter && html`
                                        <div className="relative">
                                            <button onClick=${() => setOpenDropdown(openDropdown === 'system' ? null : 'system')} className="flex items-center gap-1.5 bg-indigo-900 text-white text-[9px] md:text-[10px] font-bold rounded-md px-2.5 py-1.5 outline-none cursor-pointer shadow-sm border border-indigo-800 hover:bg-indigo-800">
                                                ${filterSystem} <i className=${`fa-solid fa-chevron-down text-[8px] ${openDropdown === 'system' ? 'rotate-180' : ''}`}></i>
                                            </button>
                                            ${openDropdown === 'system' && html`
                                                <div className="absolute top-full mt-1 right-0 w-32 bg-white rounded-lg shadow-xl border border-slate-100 z-50 overflow-hidden">
                                                    ${systems.map(s => html`<div key=${s} onClick=${() => { setFilterSystem(s); setVisibleCount(6); setOpenDropdown(null); }} className=${`px-3 py-2 text-[10px] font-bold cursor-pointer border-b border-slate-50 last:border-0 ${filterSystem === s ? 'bg-indigo-50 text-indigo-900' : 'text-slate-700 hover:bg-slate-50'}`}>${s}</div>`)}
                                                </div>
                                            `}
                                        </div>
                                    `}
                                </${React.Fragment}>
                            `}
                        </div>
                    </div>

                    <div className=${gridClass}>
                        ${isLoading ? html`
                            <${React.Fragment}>
                                ${Array(6).fill(0).map((_, i) => html`
                                    <div key=${i} className="flex flex-row sm:flex-col gap-3 p-2.5 border border-slate-100 rounded-xl bg-white animate-pulse shadow-sm">
                                        <div className=${`relative flex-shrink-0 rounded-lg bg-slate-200 ${isA4Card ? 'w-20 h-28 sm:w-full sm:h-48' : 'w-24 h-24 sm:w-full sm:h-40'}`}></div>
                                        <div className="flex flex-col flex-grow justify-between min-w-0 py-1">
                                            <div>
                                                <div className="h-3 bg-slate-200 rounded w-1/3 mb-2"></div>
                                                <div className="h-4 bg-slate-200 rounded w-3/4 mb-1"></div>
                                                <div className="h-4 bg-slate-200 rounded w-1/2"></div>
                                            </div>
                                            <div className="flex gap-2 mt-3">
                                                <div className="h-7 bg-slate-200 rounded flex-1"></div>
                                                <div className="h-7 bg-slate-200 rounded flex-1"></div>
                                            </div>
                                        </div>
                                    </div>
                                `)}
                            </${React.Fragment}>
