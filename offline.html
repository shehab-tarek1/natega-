<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#312e81">
    <title>لا يوجد اتصال بالإنترنت | بوابة الثانوية العامة</title>
    
    <!-- محاولة جلب خط كايرو إذا كان مخزناً، وإلا سيستخدم خط النظام الافتراضي -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Cairo', system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        
        .icon-container {
            width: 100px;
            height: 100px;
            background-color: #e0e7ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            box-shadow: 0 4px 10px rgba(49, 46, 129, 0.1);
            position: relative;
        }

        /* أيقونة الواي فاي المقطوع (SVG لتعمل بدون نت) */
        .icon-container svg {
            width: 50px;
            height: 50px;
            fill: #312e81;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 900;
            color: #312e81;
            margin: 0 0 12px 0;
        }

        p {
            font-size: 1rem;
            color: #64748b;
            font-weight: 700;
            margin: 0 0 32px 0;
            line-height: 1.6;
            max-width: 400px;
        }

        .btn {
            background-color: #312e81;
            color: #ffffff;
            border: none;
            padding: 14px 36px;
            font-size: 1rem;
            font-weight: 700;
            font-family: inherit;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(49, 46, 129, 0.3);
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn:active {
            transform: scale(0.95);
            background-color: #1e1b4b;
        }
    </style>
</head>
<body>

    <div class="icon-container">
        <!-- رسمة SVG للواي فاي المقطوع -->
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.88 4.12C19.86 1.41 16.08 0 12 0 7.92 0 4.14 1.41 1.12 4.12L0 5.38l2.5 2.5 1.12-1.25C6 4.31 8.87 3 12 3s6 1.31 8.38 3.62l1.12 1.25 2.5-2.5-1.12-1.25zM18.62 9.38C16.85 7.82 14.51 7 12 7s-4.85.82-6.62 2.38l-1.12 1.25 2.5 2.5 1.12-1.25C9.07 10.83 10.49 10 12 10s2.93.83 4.12 1.88l1.12 1.25 2.5-2.5-1.12-1.25zM14.38 14.62C13.73 14.05 12.9 13.75 12 13.75s-1.73.3-2.38.87L8.5 15.88l3.5 3.5 3.5-3.5-1.12-1.26z"/>
            <!-- خط القطع المائل -->
            <line x1="2" y1="2" x2="22" y2="22" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
    </div>

    <h1>أنت غير متصل بالإنترنت!</h1>
    <p>يبدو أنك فقدت الاتصال بالشبكة. يرجى التحقق من اتصال الواي فاي أو بيانات الهاتف والمحاولة مرة أخرى.</p>
    
    <button class="btn" onclick="window.location.reload()">تحديث الصفحة</button>

</body>
</html>
